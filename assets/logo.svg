<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <style>
    /* 浅色模式（默认） */
    .logo-block { fill: #111; }
    .logo-border { fill: #fff; }
    .logo-red { fill: #D92020; }
    .logo-text { fill: #111; }

    /* 深色模式 - 跟随系统主题 */
    @media (prefers-color-scheme: dark) {
      .logo-block { fill: #E0E0E0; }
      .logo-border { fill: #181818; }
      .logo-red { fill: #E84545; }
      .logo-text { fill: #E0E0E0; }
    }
  </style>

  <!-- 图标：主方块 -->
  <rect x="4" y="4" width="32" height="32" class="logo-block"/>
  <!-- 图标：红色小方块（带边框） -->
  <rect x="24" y="24" width="20" height="20" class="logo-border"/>
  <rect x="26" y="26" width="16" height="16" class="logo-red"/>

  <!-- 文字：Tanmı（粗体） -->
  <text x="56" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" class="logo-text" letter-spacing="-0.5">Tanmı</text>
  <!-- ı 上的红点 -->
  <circle cx="119" cy="12" r="2.5" class="logo-red"/>

  <!-- 文字：Workspace（细体半透明） -->
  <text x="126" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" class="logo-text" opacity="0.7">Workspace</text>
</svg>
